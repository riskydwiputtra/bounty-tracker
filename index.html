<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Bounty Tracker</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; color: #333; padding: 20px; }
        #loading { color: #888; font-style: italic; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Dashboard Tracker</h1>
    
    <div id="tempat-ui-bounty">
        <p id="loading">Memuat desain dari Moda...</p>
    </div>

    <script>
        const canvasId = '1b2b4af2-930e-56c5-83da-9d612fbf9de8'; 
        const apiKey = 'moda_live_19fd786d45135c255896628fe92f9a1cd83b7916941739c331c3d72cee7fee18'; 
        
        const apiUrl = `https://api.moda.app/v1/canvases/${canvasId}`;
        const wadahUI = document.getElementById('tempat-ui-bounty');

        fetch(apiUrl, {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Moda-Version': '2026-05-01',
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            console.log("Response lengkap dari Moda:", data);
            
            if (data.design) {
                wadahUI.innerHTML = data.design; 
            } else {
                wadahUI.innerHTML = "<p>Data UI tidak ditemukan di Canvas ini.</p>";
            }
        })
        .catch(error => {
            console.error('Gagal mengambil Canvas:', error);
            wadahUI.innerHTML = `<p class="error">Gagal memuat: ${error.message}</p>`;
        });
    </script>

</body>
</html>
